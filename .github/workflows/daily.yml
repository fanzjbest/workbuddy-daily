name: WorkBuddy 每日任务

on:
  schedule:
    # 每天北京时间 10:00 签到 + 派猫猫旅行（UTC 02:00）
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  growth:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: 执行成长中心任务
        env:
          WB_STATE: ${{ secrets.WB_STATE }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: python wb_growth_cloud.py

      - name: 上传结果截图（排查用）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-screenshot
          path: |
            result.png
            login_required.png
          retention-days: 3
          if-no-files-found: ignore