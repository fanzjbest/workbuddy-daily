name: WorkBuddy 每日签到 + 派猫猫旅行

on:
  schedule:
    # 北京时间每天 10:00 执行（UTC 02:00）
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  daily-task:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 验证环境变量
        run: |
          echo "Python: $(command -v python)"
          echo "Python 版本: $(python --version)"
          echo "WORKBUDDY_ACCESS_TOKEN 已配置: ${{ secrets.WORKBUDDY_ACCESS_TOKEN != '' }}"
          echo "WORKBUDDY_USER_ID 已配置: ${{ secrets.WORKBUDDY_USER_ID != '' }}"
          echo "FEISHU_WEBHOOK 已配置: ${{ secrets.FEISHU_WEBHOOK != '' }}"

      - name: 执行 WorkBuddy 每日任务
        env:
          WORKBUDDY_ACCESS_TOKEN: ${{ secrets.WORKBUDDY_ACCESS_TOKEN }}
          WORKBUDDY_USER_ID: ${{ secrets.WORKBUDDY_USER_ID }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_WEBHOOK_SIGN: ${{ secrets.FEISHU_WEBHOOK_SIGN }}
        run: |
          python workbuddy_daily.py

      - name: 运行失败通知
        if: failure()
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_WEBHOOK_SIGN: ${{ secrets.FEISHU_WEBHOOK_SIGN }}
        run: |
          python -c "
          import sys; sys.path.insert(0, '.')
          from workbuddy_daily import get_env, push_feishu
          import datetime
          webhook = get_env('FEISHU_WEBHOOK')
          sign = get_env('FEISHU_WEBHOOK_SIGN', '')
          if webhook:
              msg = '❌ WorkBuddy 每日任务执行失败\\n⏰ ' + datetime.datetime.now().strftime('%Y-%m-%d %H:%M')
              push_feishu(webhook, sign, msg)
          "
